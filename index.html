<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="个人开源应用收藏夹：模块化主页，自动展示 GitHub 项目介绍与最新 Release 下载地址">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ctext x='12' y='44' font-family='monospace' font-size='34' font-weight='bold' fill='%2355e3c2'%3E%26gt;_%3C/text%3E%3C/svg%3E">
  <title>OPEN / SHELF · 我的开源应用</title>

  <link rel="preconnect" href="https://api.github.com">
  <!-- 主题脚本尽早执行，首屏前定好明暗，避免闪烁 -->
  <script src="assets/js/core/theme.js"></script>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/landing.css">
  <link rel="stylesheet" href="assets/css/sync.css">
  <link rel="stylesheet" href="assets/css/theme.css">

  <!-- 内核：依赖顺序固定，全部 defer，DOM 解析完成后按序执行 -->
  <script defer src="assets/js/core/store.js"></script>
  <script defer src="assets/js/core/net.js"></script>
  <script defer src="assets/js/core/kernel.js"></script>
  <script defer src="assets/js/core/select.js"></script>
  <script defer src="assets/js/core/sync.js"></script>

  <!-- 业务模块注册（首页只读取元数据渲染入口，不挂载模块） -->
  <script defer src="assets/js/modules/repo-showcase/defaults.js"></script>
  <script defer src="assets/js/modules/repo-showcase/github.js"></script>
  <script defer src="assets/js/modules/repo-showcase/view.js"></script>
  <script defer src="assets/js/modules/repo-showcase/index.js"></script>
  <script defer src="assets/js/modules/notes/defaults.js"></script>
  <script defer src="assets/js/modules/notes/markdown.js"></script>
  <script defer src="assets/js/modules/notes/view.js"></script>
  <script defer src="assets/js/modules/notes/index.js"></script>

  <!-- 最后启动 -->
  <script defer src="assets/js/core/app.js"></script>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <div class="page">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>&gt;_</span></div>
        <div class="brand-text">
          <!-- 改这里即可换成你自己的站名 -->
          <h1>OPEN<span>/</span>SHELF</h1>
          <p>我常用的开源应用 · 自动同步 GitHub Release</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="status status--icon" title="系统在线" aria-label="系统在线"><i class="i-ico i-system" aria-hidden="true"></i><i class="dot" aria-hidden="true"></i></span>
        <a class="ghost-link ghost-link--icon mono" href="https://github.com" target="_blank" rel="noopener noreferrer" title="打开 GitHub" aria-label="打开 GitHub"><i class="i-ico i-github" aria-hidden="true"></i></a>
      </div>
    </header>

    <section class="lc-hero">
      <span class="lc-eyebrow mono"><i aria-hidden="true"></i> PERSONAL OPEN-SOURCE HUB</span>
      <h2>把常用的开源应用，<br><em>收进一个架子。</em></h2>
      <p class="lc-lead">每个功能都是一个独立模块，互不干扰。点开下面的模块，粘贴 GitHub 仓库地址即可自动读取项目介绍与最新 Release 下载地址。</p>
      <div class="lc-stats" aria-label="站点特性">
        <div class="lc-stat" title="2 个独立模块"><b>02</b><span>MODULES</span></div>
        <div class="lc-stat" title="支持任意 GitHub 仓库"><b>∞</b><span>REPOS</span></div>
        <div class="lc-stat" title="零构建依赖"><b>0</b><span>DEPS</span></div>
      </div>
    </section>

    <section class="lc-section" aria-labelledby="lc-modules-title">
      <div class="lc-section-head">
        <h3 id="lc-modules-title">MODULES / 模块入口</h3>
        <span class="lc-rule" aria-hidden="true"></span>
        <span class="lc-hint">SELECT TO ENTER <i class="i-ico i-ext" aria-hidden="true"></i></span>
      </div>
      <!-- 模块入口卡片由内核根据注册表自动生成 -->
      <main id="catalog" class="lc-catalog"></main>
    </section>

    <footer class="site-footer mono">
      <span>© <span id="year"></span> · 数据来自 GitHub REST API</span>
      <span>STATIC / MODULAR / NO BUILD</span>
    </footer>
  </div>
</body>
</html>
